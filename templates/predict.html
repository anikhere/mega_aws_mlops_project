<!DOCTYPE html>
<html>
<body>
    <h1>Prediction Result</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Field</th>
            <th>Value</th>
        </tr>
        {% for key, value in data.items() %}
        <tr>
            <td>{{ key }}</td>
            <td>{{ value }}</td>
        </tr>
        {% endfor %}
    </table>

    <h2>Predicted Exam Score: {{ prediction }}</h2>

</body>
</html>
