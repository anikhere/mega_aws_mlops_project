name: AWS_MEGA_PROJECT
on:
  push:
    branches:
      - Main
jobs:
  build-and-push:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Configure AWS CREDENTIALS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: building docker image
        run: | 
          docker build -t ${{ steps.login-ecr.outputs.registry }}/student-performance-app:latest .
      
      - name: pushing the ecr image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/student-performance-app:latest 
  
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: deploy to ec2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}
            docker pull ${{ secrets.ECR_REPOSITORY_URI }}:latest
            docker stop student-app || true
            docker rm student-app || true
            docker run -d --name student-app -p 8000:8000 ${{ secrets.ECR_REPOSITORY_URI }}:latest